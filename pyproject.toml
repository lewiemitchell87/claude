[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "footyvalue"
version = "0.1.0"
description = "Football value-betting detection engine (Match Odds, BTTS, Over/Under) for pre-game and in-play"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
live = ["requests>=2.28"]
dev = ["pytest>=7.0", "requests>=2.28"]

[project.scripts]
footyvalue = "footyvalue.cli:main"

[tool.setuptools]
packages = ["footyvalue", "footyvalue.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
